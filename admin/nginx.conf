server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any unknown path falls back to index.html
    # so React Router can handle it (e.g. refreshing /projects).
    location / {
        try_files $uri /index.html;
    }

    # Hashed build files never change, so browsers can cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
